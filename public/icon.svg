<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect for maskable safe zone -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Cyber grid lines subtle -->
  <path d="M64 128h384M64 256h384M64 384h384M128 64v384M256 64v384M384 64v384" stroke="#334155" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Outer Shield contour -->
  <path d="M256 80 L380 134 V250 C380 336 320 398 256 428 C192 398 132 336 132 250 V134 Z"
        fill="url(#shieldGrad)" stroke="url(#accentGrad)" stroke-width="8" filter="url(#glow)"/>

  <!-- Caddy 'C' & Proxy Dynamic Nodes -->
  <circle cx="256" cy="240" r="76" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-dasharray="320 120" stroke-linecap="round" transform="rotate(-45 256 240)"/>

  <!-- Center Core Pulsing Dot -->
  <circle cx="256" cy="240" r="22" fill="#10b981"/>
  <circle cx="256" cy="240" r="34" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- Proxy Routing Nodes (Left, Top, Right, Bottom) -->
  <circle cx="190" cy="180" r="10" fill="#06b6d4"/>
  <circle cx="322" cy="180" r="10" fill="#3b82f6"/>
  <circle cx="190" cy="300" r="10" fill="#10b981"/>
  <circle cx="322" cy="300" r="10" fill="#38bdf8"/>

  <!-- Connecting circuit pathways -->
  <path d="M190 180 L230 220" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
  <path d="M322 180 L282 220" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <path d="M190 300 L230 260" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <path d="M322 300 L282 260" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

  <!-- SSL/TLS Padlock badge at top right -->
  <g transform="translate(340, 96) scale(0.9)">
    <rect x="0" y="16" width="36" height="28" rx="6" fill="#10b981"/>
    <path d="M8 16 V10 C8 4.5 12.5 0 18 0 C23.5 0 28 4.5 28 10 V16" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <circle cx="18" cy="28" r="3.5" fill="#090d16"/>
  </g>
</svg>
